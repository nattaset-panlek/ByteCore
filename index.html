<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Xea OS</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <!-- SVG Sprite (icons) -->
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;left:-9999px;top:-9999px">
    <symbol id="ico-win" viewBox="0 0 24 24"><path d="M2 4l9-2v9H2zM13 2l9-2v11h-9zM2 13h9v9l-9-2zM13 13h9v11l-9-2z" fill="currentColor"/></symbol>
    <symbol id="ico-wallet" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="17" cy="12" r="1.5" fill="currentColor"/></symbol>
    <symbol id="ico-rig" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/><path d="M8 2v4M12 2v4M16 2v4M8 18v4M12 18v4M16 18v4M2 8h4M2 12h4M2 16h4M18 8h4M18 12h4M18 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ico-tasks" viewBox="0 0 24 24"><path d="M4 5h9M4 12h9M4 19h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 6l2 2 4-4M16 13l2 2 4-4M16 20l2 2 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ico-net" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
    <symbol id="ico-logs" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M14 3v5h5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 11h8M8 15h8M8 19h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ico-min" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ico-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" ry="1" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
    <symbol id="ico-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <!-- Desktop -->
  <div id="desktop" class="desktop"></div>

  <!-- Taskbar -->
  <div class="taskbar" id="taskbar">
    <button class="start">
      <svg class="ico"><use href="#ico-win"/></svg>
    </button>
    <div class="tasks" id="taskButtons"></div>
    <div class="tray"><div id="trayClock"></div></div>
  </div>

  <!-- Entry -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
